name: Build NetKas APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses and install SDK 36.1
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed -e 's/^[[:space:]]*//')"
            if [[ "$TRIMMED" == \{* ]]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n ' | base64 -d > app/google-services.json
            fi
          fi
          if [ ! -s app/google-services.json ]; then
            echo "::error::File app/google-services.json tidak ditemukan! Upload app/google-services.json ke folder app/ di GitHub atau simpan isinya di GitHub Secret bernama GOOGLE_SERVICES_JSON."
            exit 1
          fi
          if ! grep -q '"client_type"[[:space:]]*:[[:space:]]*3' app/google-services.json; then
            echo "::error::app/google-services.json belum memiliki Web OAuth Client (client_type: 3) untuk default_web_client_id. Pastikan memakai file app/google-services.json yang benar dari proyek ini / Firebase Console."
            exit 1
          fi

      - name: Prepare debug keystore and env
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore || rm -f debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android > /dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: >-
          gradle :app:assembleDebug
          --no-configuration-cache
          --max-workers=2
          --console=plain
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Upload NetKas APK
        uses: actions/upload-artifact@v4
        with:
          name: NetKas-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
